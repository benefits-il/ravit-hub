            }

            .staticrypt-title {

                font-weight: 900;
                font-size: 1.6em;
                color: #0f172a;
                margin: 0 0 10px;
            }

            .staticrypt-instructions p {
                margin: 0 0 6px;
                font-size: 16px;
                line-height: 1.6;
            }

            .staticrypt-hr {
                margin-top: 18px;
                margin-bottom: 18px;
                border: 0;
                border-top: 2px dashed #fde68a;
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: inherit;
                border: 0;
                box-sizing: border-box;
                font-size: 16px;
                font-family: "Varela Round", "Rubik", system-ui, sans-serif;
                outline: 0;
                padding: 14px 15px 14px 44px;
                width: 100%;
                direction: ltr;
                text-align: center;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: #fef3c7;
                width: 100%;
                border: 2.5px solid #0f172a;
                border-radius: 14px;
                margin: 0 0 15px;
                box-sizing: border-box;
                overflow: hidden;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 60%;
                padding: 13px;
                position: absolute;
                left: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                outline: 0;
                background: #047857;
                width: 100%;
                border: 2.5px solid #0f172a;
                border-radius: 999px;
                padding: 13px;
                color: #ffffff;
                font-family: "Rubik", system-ui, sans-serif;
                font-weight: 700;
                font-size: 16px;
                cursor: pointer;
                box-shadow: 0 6px 0 0 #064e3b;
                transition: transform 0.12s, box-shadow 0.12s;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: #047857;
                transform: translateY(-2px);
            }

            .staticrypt-form .staticrypt-decrypt-button:active {
                transform: translateY(3px);
                box-shadow: 0 2px 0 0 #064e3b;
            }

            .staticrypt-instructions {
                margin-top: 0;
                margin-bottom: 1em;
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-bottom: 1em;
                font-size: 16px;
                gap: 0.7em;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.5);
                accent-color: #047857;
            }

            .staticrypt-stars {
                margin-top: 16px;
                color: #047857;
                font-size: 16px;
                letter-spacing: 0.5em;
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
            }

                border-radius: 50%;
                animation: spinner-border 0.75s linear infinite;
            }

                100% {
                    transform: rotate(360deg);
                }
            }
